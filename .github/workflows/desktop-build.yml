name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agentone-desktop/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
            artifact: windows
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux
          - platform: macos-latest
            args: --bundles app,dmg
            artifact: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentone-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: agentone-desktop/src-tauri

      - name: Install npm dependencies
        working-directory: agentone-desktop
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agentone-desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SaitronBot Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: saitronbot-${{ matrix.artifact }}
          path: agentone-desktop/src-tauri/target/release/bundle/**/*.*
          if-no-files-found: warn